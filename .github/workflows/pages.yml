name: Deploy Pages

on:
  workflow_run:
    workflows: ["OKF bundle CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-okf.lock
      - run: python3 -m venv .venv
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python -m pip install --requirement requirements-okf.lock
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/migrate_okf_v02.py --check
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/build_okf_bundle.py --check
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/update_viewer.py --check
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/check_british_english.py
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/check_publication.py
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python scripts/check_publication_contract.py
      - if: github.event_name == 'workflow_dispatch'
        run: .venv/bin/python -m unittest discover -s tests -v
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bundle
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Verify deployed routes and identity
        env:
          OKF_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: .venv/bin/python scripts/verify_deployment.py
